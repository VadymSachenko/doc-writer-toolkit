name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Every step after the first runs even when an earlier one failed, so each check shows its own result.
jobs:
  # Which of the slower side jobs a pull request needs: each runs only when its own files (or this workflow) changed.
  # A push to main and a manual run run them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      visual: ${{ steps.diff.outputs.visual }}
      sme: ${{ steps.diff.outputs.sme }}
      cli: ${{ steps.diff.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'visual=true\nsme=true\ncli=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          wf='^\.github/workflows/check\.yml$'
          echo "visual=$(has "$wf|^plugins/doc-writer-toolkit/scripts/(visual-pack|transcriber)/")" >> "$GITHUB_OUTPUT"
          echo "sme=$(has "$wf|^plugins/doc-writer-toolkit/scripts/sme-video-context/")" >> "$GITHUB_OUTPUT"
          echo "cli=$(has "$wf|^\.claude-plugin/|^plugins/doc-writer-toolkit/(\.claude-plugin|skills|commands|agents|hooks)/|^tools/check-visibility")" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 18.x is the floor the scripts declare (engines >= 18.3). One version only, to keep Actions minutes down: the
        # side jobs below run on lts/*.
        node: ['18.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # For video-parts: its four tests on real files run only where ffmpeg is installed. A slow or stuck package
      # mirror must not cost the job (one hung for the whole job once): the step gives up after 4 minutes, and the
      # four tests then show as skipped, with a warning on the run.
      - name: Install ffmpeg
        id: ffmpeg
        timeout-minutes: 4
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Warn that the video-parts tests on real files are skipped
        if: ${{ !cancelled() && steps.ffmpeg.outcome != 'success' }}
        run: echo "::warning title=ffmpeg not installed::The ffmpeg install failed or timed out (${{ steps.ffmpeg.outcome }}), so video-parts' four tests on real files are skipped on Node ${{ matrix.node }}."
      - name: Lint the plugin (frontmatter, plugin-root paths, routing coverage, line endings)
        run: node tools/lint-plugin.mjs
      - name: Test the tools
        if: ${{ !cancelled() }}
        run: node --test tools/lint-plugin.test.mjs tools/check-visibility.test.mjs tools/harness/harness.test.mjs
      - name: Test ui-labels
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/ui-labels
      - name: Test locale-sync
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/locale-sync
      - name: Test doc-align
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/doc-align
      - name: Test screenshot-locales
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/screenshot-locales
      - name: Test section-state
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/section-state
      - name: Test pipeline-measures
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/pipeline-measures
      - name: Test tracker
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/tracker
      - name: Test forge
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/forge
      - name: Test ticket-state
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/ticket-state
      # The four tests on real files run with the ffmpeg installed above.
      - name: Test video-parts
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/video-parts
      # The offline tests only: the browser test needs Playwright and runs in its own job below.
      - name: Test visual-pack (offline)
        if: ${{ !cancelled() }}
        run: npm run test:offline
        working-directory: plugins/doc-writer-toolkit/scripts/visual-pack
      - name: Test transcriber (offline)
        if: ${{ !cancelled() }}
        run: npm run test:offline
        working-directory: plugins/doc-writer-toolkit/scripts/transcriber

  # The visual-pack tests with the browser test, which needs Playwright and Chromium. The script has no dependency of
  # its own and loads Playwright from the folder VISUAL_PACK_PLAYWRIGHT_FROM names, so it is installed there, outside
  # the checkout. The version is the one the docs repos use. A missing browser would make `npm test` exit 2, which fails.
  visual-pack:
    needs: changes
    if: ${{ needs.changes.outputs.visual == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Playwright and Chromium
        run: |
          echo "VISUAL_PACK_PLAYWRIGHT_FROM=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.61.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test visual-pack
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/visual-pack
      # The transcriber's browser test reads the same folder (VISUAL_PACK_PLAYWRIGHT_FROM).
      - name: Test transcriber
        if: ${{ !cancelled() }}
        run: npm test
        working-directory: plugins/doc-writer-toolkit/scripts/transcriber

  # The unit tests of the Python script behind extract-sme-screenshots. They install only the two image packages in
  # tests/requirements.txt, pinned as in sme-video-requirements.txt: no ffmpeg, no tesseract, no faster-whisper.
  # 3.9 is the Python the macOS venv of that skill runs on.
  sme-video-context:
    needs: changes
    if: ${{ needs.changes.outputs.sme == 'true' }}
    # Pinned: Python 3.9, the oldest version this job tests, isn't available on newer images.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: plugins/doc-writer-toolkit/scripts/sme-video-context/tests/requirements.txt
      - name: Install the test packages
        run: python -m pip install -r plugins/doc-writer-toolkit/scripts/sme-video-context/tests/requirements.txt
      - name: Test sme-video-context
        run: python plugins/doc-writer-toolkit/scripts/sme-video-context/tests/run.py

  # The two checks that need the Claude Code CLI. Neither needs credentials. The CLI needs Node 22 or later,
  # and is pinned so its token estimates don't move under the visibility check.
  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.307
      - name: Validate the plugin
        run: claude plugin validate plugins/doc-writer-toolkit
      - name: Check that every skill and command loads with its description
        if: ${{ !cancelled() }}
        run: node tools/check-visibility.mjs
